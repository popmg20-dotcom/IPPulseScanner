name: Build APK - 247 X-Falcon

on:
  push:
    branches:
      - 'integration/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle

          echo "Android project: OK"

      - name: Validate Falcon architecture
        shell: bash
        run: |
          set -euo pipefail

          F="app/src/main/java/com/github/xfalcon/vhosts/vservice/VhostsService.java"

          test -f "$F"
          test -f "app/src/main/java/com/github/xfalcon/vhosts/vservice/DnsChange.java"

          grep -qE \
            'private[[:space:]]+int[[:space:]]+mtu[[:space:]]*=[[:space:]]*247' \
            "$F"

          grep -qE \
            'builder\.setMtu[[:space:]]*\([[:space:]]*mtu[[:space:]]*\)' \
            "$F"

          grep -q 'getIntExtra(EXTRA_MTU' "$F"
          grep -q 'getStringExtra(EXTRA_HOSTS)' "$F"
          grep -q 'DnsChange.handle_hosts' "$F"

          if grep -RniE \
            'GamingVpnService|com\.ippulse\.scanner\.localvpn|wgPrivateKey|wgPeerKey|wgEndpoint|wgAllowedIPs|wgAddress|wgConfig|127\.0\.0\.1:8766' \
            app/src/main \
            --exclude='*.bak*' \
            --exclude-dir='main.bak_'
          then
            echo "STOP: forbidden reference"
            exit 1
          fi

          echo "ARCHITECTURE VALIDATION: OK"

      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail

          M="app/src/main/AndroidManifest.xml"

          test "$(grep -c 'android:name="com.github.xfalcon.vhosts.vservice.VhostsService"' "$M")" -eq 1
          test "$(grep -c '<service' "$M")" -eq 1
          grep -q 'android.permission.BIND_VPN_SERVICE' "$M"
          grep -q 'android.net.VpnService' "$M"

          echo "MANIFEST VALIDATION: OK"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            2>&1 | tee build.log

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          echo "APK FOUND:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPPulseScanner-247-XFalcon-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPPulseScanner-247-XFalcon-build-log
          path: build.log
          if-no-files-found: warn
