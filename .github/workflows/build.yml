name: Build APK

on:
  push:
    branches:
      - 'integration/**'
      - 'inject-original-debug-tab12-f9'
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Validate architecture
        run: |
          chmod +x validate.sh
          ./validate.sh
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IPPulseScanner-247-XFalcon-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPPulseScanner-247-XFalcon-build-log
          path: build.log
